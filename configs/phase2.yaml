# CIR-ARC Phase 2.5 Configuration
# Object-Centric Structured Perception with Relational Graph & Multi-Scale Slot Attention

model:
  num_colors: 11          # 0-9 ARC discrete colors + 10 mask/padding token
  embed_dim: 48           # Color embedding dimension
  stem_hidden_dim: 64     # CNN stem stage 1 intermediate channels
  stem_out_dim: 128       # Multi-scale CNN stem feature token dimension
  n_slots: 24             # Maximum object slots K
  slot_dim: 128           # Dimensionality of slot vectors
  feat_dim: 128           # Input visual feature token dimension
  n_iter: 3               # Slot attention competitive refinement iterations
  mlp_hidden_dim: 256     # Slot attention residual MLP hidden dimension
  relation_layers: 2      # Relational Set Transformer self-attention blocks
  relation_heads: 4       # Multi-head attention heads in relation encoder
  max_h: 30               # Maximum supported grid height
  max_w: 30               # Maximum supported grid width
  prop_hidden_dim: 64     # Property prediction heads MLP hidden dimension
  num_shapes: 8           # Categorical shape classes
  num_orientations: 4     # Orientation bins (0, 90, 180, 270 degrees)
  num_symmetries: 4       # Binary symmetry axes
  recon_num_colors: 10    # Target output colors (0-9)

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  clip_grad_norm: 1.0
  batch_size: 16
  epochs: 30
  num_workers: 0          # Windows multiprocessing safety
  seed: 42
  device: "cuda"

loss_weights:
  recon_weight: 1.0       # Grid cell-level cross-entropy
  color_weight: 1.0       # Hungarian-matched object color cross-entropy
  pos_weight: 1.0         # Hungarian-matched object centroid MSE
  size_weight: 1.0        # Hungarian-matched object normalized area MSE
  bbox_weight: 0.5        # Hungarian-matched object normalized bounding box Smooth L1
  dims_weight: 0.5        # Hungarian-matched object geometric dimensions MSE
  shape_weight: 0.5       # Hungarian-matched object categorical shape CE
  obj_weight: 1.5         # Boosted slot objectness focal BCE
  relation_weight: 0.5    # Pairwise 14-predicate relational graph BCE
  identity_weight: 0.1    # Contrastive slot identity discrimination loss
  bound_weight: 0.8       # Spatial boundary map binary cross-entropy
  cell_obj_weight: 0.8    # Cell-level foreground objectness BCE
  mask_weight: 1.0        # Hungarian-matched per-slot spatial mask BCE + Dice
  excl_weight: 0.05       # Mask spatial exclusivity penalty
  div_weight: 0.01        # Slot cosine diversity penalty
  sparse_weight: 0.01     # Objectness L1 sparsity regularization

data:
  train_dir: "data/synthetic/train"
  held_out_dir: "data/synthetic/held_out"
  pad_token: 10
  max_grid_dim: 30

experiment:
  name: "phase2_multiscale_slot_perception"
  checkpoint_dir: "checkpoints/phase2"
  save_interval_epochs: 5
  log_interval_steps: 100
